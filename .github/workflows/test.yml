name: Check build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --check dist/app.js && node --check dist/rules.js && node --check dist/changes.js && node --test tests/*.test.cjs
